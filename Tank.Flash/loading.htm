<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đang vào game…</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" />
  <link rel="stylesheet" href="theme/site.css" />
  <script src="/site-config.js"></script>
</head>
<body class="game-body">
  <div class="game-bar">
    <a class="logo" href="index.htm"><span class="tag">PVP</span><span class="name" data-site="name">Bắn Súng</span></a>
    <div class="actions">
      <button class="pill-btn" id="fullscreen">⛶ Toàn màn hình</button>
      <a class="pill-btn" href="index.htm" id="leave">Thoát</a>
    </div>
  </div>
  <div class="game-frame" id="frame">
    <div class="loader" id="loader">
      <div>
        <img src="theme/img/chibi-girl.png" alt="" />
        <p id="loader-text">Đang vào game, chờ chút nhé…</p>
        <div class="bar"><i></i></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var cfg = window.SITE_CONFIG || {};
      var name = cfg.name || "Bắn Súng";
      document.title = name;
      document.querySelectorAll('[data-site="name"]').forEach(function (el) { el.textContent = name; });

      var frame = document.getElementById("frame");
      document.getElementById("fullscreen").onclick = function () {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (frame.requestFullscreen) frame.requestFullscreen();
      };

      // LoginGame.aspx returns the game URL (playgame.aspx?user=..&key=..) or "0" when not logged in.
      // Navigate to it directly: Ruffle does not start the client when playgame.aspx sits in an iframe.
      fetch("LoginGame.aspx", { credentials: "same-origin", cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (url) {
          url = url.trim();
          if (!url || url === "0" || url.charAt(0) === "<") { location.replace("index.htm?open=self"); return; }
          location.replace(url);
        })
        .catch(function () { document.getElementById("loader-text").textContent = "Không kết nối được máy chủ, tải lại trang để thử lại."; });
    })();
  </script>
</body>
</html>
